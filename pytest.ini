# Bare `pytest` at the repo root runs the suite CLAUDE.md section 1 names:
# tests/. A path on the command line still wins, so every other test file
# runs as before, by its own command:
#   * service/vision_analyze/tests/ (its `tests` package would collide with
#     this one in a single run);
#   * each directory under evaluations/, alone. Those harnesses put their
#     own directory on sys.path and import bare sibling names (`rows`,
#     `readers`), so two directories in one run share the first one's
#     modules: bare `pytest` used to stop on two collection errors there
#     (3.209.C).
[pytest]
testpaths = tests
